name: Sürüm / Release

# v1.0.1 gibi bir etiket gönderildiğinde wd-nobetci-eczane-ekrani.zip dosyasını oluşturup sürüme ekler.
# Builds wd-nobetci-eczane-ekrani.zip and attaches it to the release when a tag like v1.0.1 is pushed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
      - name: PHP sözdizimi kontrolü / PHP lint
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: ZIP oluştur / Build ZIP
        run: |
          mkdir -p build/wd-nobetci-eczane-ekrani
          git archive HEAD | tar -x -C build/wd-nobetci-eczane-ekrani
          cd build && zip -rq wd-nobetci-eczane-ekrani.zip wd-nobetci-eczane-ekrani
      - uses: softprops/action-gh-release@v2
        with:
          files: build/wd-nobetci-eczane-ekrani.zip
          generate_release_notes: true
